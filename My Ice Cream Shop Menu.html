<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Shop Menu </title>
    <style>
    body{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        background-color: rgb(255, 192, 255);
        text-align: center;
        color: rgb(255, 255, 108);
    }
    h1{
        color: rgb(252, 0, 0);
        font-size: 36px;
    }
    h1 + p {
        color: mediumvioletred;
        font-weight: bold;
        background-color: rgb(0, 8, 255);
        border-radius: 10px;
    }
    .shop-description::first-letter {
        font-size: 30px;
        color: chocolate;
        font-weight: bolder;

    }
    .menu-box{
        width: 420px;
        background-color: rgb(21, 255, 0);
        border: 3px solid hsl(46, 99%, 51%);
        border-radius: 15px;
        margin: 20px auto;
        padding: 20px;
    }
    ul{
        padding: 0;
    }
    ul > li {
        list-style: none;
        background-color: rgb(22, 0, 82);
      color: #0d007e;
      font-size: 18px;
      font-weight: bold;
      margin: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #fd1034;
    }
    ul > li:nth-child(3) {
      background-color: #01036a;
      color: #c8ff00;
      border: 3px solid #f2ff00;
    }
    ul > li:hover {
      background-color: #fc4078;
      color: rgb(208, 250, 0);
      cursor: pointer;
      transform: scale(1.05);
    }
    button {
      background-color: hsl(52, 100%, 50%);
      color: rgb(0, 221, 255);
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #a4004d;
    }
    </style>
    </head>
    <body>

  <h1>My Ice Cream Shop Menu</h1>
  <p>Welcome to Scoops of Joy!</p>
  <p class="shop-description">
    We serve colourful, creamy, and delicious ice cream flavours.
  </p>
  <div class="menu-box">
    <h2>Today's Ice Cream Flavours</h2>
    <ul>
      <li>Bubblegum feast</li>
      <li>Orange Swril</li>
      <li> Cherry berry- Today's Special</li>
      <li>Chocolate Dream</li>
      <li>Oreo-cream wonderland</li>
    </ul>
    <button>Order Now</button>
  </div>
</body>
</html>

    


        
    </style>
</head>
<body>
    
</body>
</html>
