<body>
    <head>
        <title>My Zoo</title>
        <style>
            body {
                font-family: fantasy;
                background: rgb(189, 189, 244);
                text-align: center;
                padding: 30px;
            }
            h1 {
                color: rgb(0, 255, 166);
            }

            #zoo {
                border: 2px solid rgb(255, 255, 106);
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background: rgb(154, 251, 251);
            }

            .zone {
                border: 1px solid light rgb(159, 80, 233);
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: center;
            }

            button {
                background: aqua;
                color: blue;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }

        </style>

        <h1>My Zoo</h1>
        <p>Use JavaScript and the DOM to add animals to each cage!</p>

        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"></span></div>
            <div class="zone">Zone 2: <span id="zone2"></span></div>
            <div class="zone">Zone 3: <span id="zone3"></span></div>
            <div class="zone">Total Animals: <span id="total"></span></div>

        </div>
         </div>

         <br>

         <button onclick="openZoo()">Open the Zoo!</button>

         <p id="zoo-status"></p>

         <script>
            function openZoo() {

             document.getElementById("zone1").innerHTML="Lion";
             document.getElementById("zone2").innerHTML="Elephant";
             document.getElementById("zone3").innerHTML="Penguin";
             document.getElementById("total").innerHTML="3";
             document.getElementById("zoo").style.backgroundColor="Darkgreen";

             document.getElementById("zoo-status").innerHTML = document.title + "is now open";


            }
         </script>
    </head>
</body>
